<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
     <link rel="stylesheet" href="css/style.css">
     
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-money-bill-wave"></i> Expense Tracker</h1>
            <p>Track your income and expenses with ease</p>
        </header>

        <div class="balance-container">
            <div class="card balance-box income">
                <h3>INCOME</h3>
                <div class="balance-amount" id="incomeTotal">+ ₹0.00</div>
            </div>
            
            <div class="card balance-box expense">
                <h3>EXPENSE</h3>
                <div class="balance-amount" id="expenseTotal">- ₹0.00</div>
            </div>
            
            <div class="card balance-box balance">
                <h3>BALANCE</h3>
                <div class="balance-amount" id="balanceTotal">₹0.00</div>
            </div>
        </div>

        <div class="card">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" class="form-control" id="description" placeholder="Enter description" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter amount" step="0.01" min="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select class="form-control" id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select class="form-control" id="category" required>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Investment">Investment</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </div>

        <div class="card">
            <h2>Transactions</h2>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="income">Income</button>
                <button class="filter-btn" data-filter="expense">Expenses</button>
            </div>
            
            <ul class="transaction-list" id="transactionList">
                <!-- Transactions will be added here dynamically -->
            </ul>
        </div>

        <div class="card">
            <h2>Expense Breakdown (by Category)</h2>
            <div class="chart-container" id="chartContainer">
                <canvas id="expenseChart"></canvas>
                <div id="noDataMessage" style="text-align: center; padding: 40px; color: #7f8c8d;">
                    <i class="fas fa-chart-pie" style="font-size: 48px; margin-bottom: 15px;"></i>
                    <p>Chart will appear here when you have expenses</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Overview (Income, Expense & Balance)</h2>
            <div class="chart-container">
                <canvas id="summaryChart"></canvas>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
