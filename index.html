<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .balance-box {
            flex: 1;
            min-width: 200px;
            margin: 10px;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            color: white;
        }

        .balance-box h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .balance-box.income {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .balance-box.expense {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .balance-box.balance {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .transaction-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .transaction-item:hover {
            background: #f9f9f9;
        }

        .transaction-details {
            flex: 1;
        }

        .transaction-title {
            font-weight: 600;
            color: #2c3e50;
        }

        .transaction-category {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .transaction-amount {
            font-weight: 600;
            font-size: 1.1rem;
            margin-right: 15px;
        }

        .transaction-amount.income {
            color: #27ae60;
        }

        .transaction-amount.expense {
            color: #c0392b;
        }

        .transaction-actions {
            display: flex;
            gap: 10px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #ecf0f1;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #3498db;
            color: white;
        }

        .chart-container {
            height: 250px;
            margin-top: 20px;
            position: relative;
        }

        #expenseChart, #summaryChart {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .transaction-form {
                grid-template-columns: 1fr;
            }
            
            .balance-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-money-bill-wave"></i> Expense Tracker</h1>
            <p>Track your income and expenses with ease</p>
        </header>

        <div class="balance-container">
            <div class="card balance-box income">
                <h3>INCOME</h3>
                <div class="balance-amount" id="incomeTotal">+ ₹0.00</div>
            </div>
            
            <div class="card balance-box expense">
                <h3>EXPENSE</h3>
                <div class="balance-amount" id="expenseTotal">- ₹0.00</div>
            </div>
            
            <div class="card balance-box balance">
                <h3>BALANCE</h3>
                <div class="balance-amount" id="balanceTotal">₹0.00</div>
            </div>
        </div>

        <div class="card">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" class="form-control" id="description" placeholder="Enter description" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter amount" step="0.01" min="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select class="form-control" id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select class="form-control" id="category" required>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Investment">Investment</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </div>

        <div class="card">
            <h2>Transactions</h2>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="income">Income</button>
                <button class="filter-btn" data-filter="expense">Expenses</button>
            </div>
            
            <ul class="transaction-list" id="transactionList">
                <!-- Transactions will be added here dynamically -->
            </ul>
        </div>

        <div class="card">
            <h2>Expense Breakdown (by Category)</h2>
            <div class="chart-container" id="chartContainer">
                <canvas id="expenseChart"></canvas>
                <div id="noDataMessage" style="text-align: center; padding: 40px; color: #7f8c8d;">
                    <i class="fas fa-chart-pie" style="font-size: 48px; margin-bottom: 15px;"></i>
                    <p>Chart will appear here when you have expenses</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Overview (Income, Expense & Balance)</h2>
            <div class="chart-container">
                <canvas id="summaryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const transactionForm = document.getElementById('transactionForm');
        const transactionList = document.getElementById('transactionList');
        const incomeTotal = document.getElementById('incomeTotal');
        const expenseTotal = document.getElementById('expenseTotal');
        const balanceTotal = document.getElementById('balanceTotal');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // Chart instances
        let expenseChart = null;
        let summaryChart = null;

        // Currency formatter for Indian Rupee (INR) with Indian numbering system
        const inrFormatter = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        // Initialize transactions array from localStorage or empty array (robust parsing)
        let transactions = [];
        try {
            const stored = localStorage.getItem('transactions');
            if (stored) {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) transactions = parsed;
            }
        } catch (err) {
            console.warn('Failed to parse stored transactions. Resetting storage.');
            localStorage.removeItem('transactions');
        }

        // Generate unique ID for each transaction
        function generateID() {
            return Math.floor(Math.random() * 1000000);
        }

        // Add transaction
        function addTransaction(e) {
            e.preventDefault();
            
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            
            if (description.trim() === '' || isNaN(amount) || amount <= 0) {
                alert('Please enter a valid description and amount');
                return;
            }
            
            const transaction = {
                id: generateID(),
                description,
                amount: type === 'income' ? amount : -amount,
                type,
                category,
                date: new Date().toLocaleDateString('en-IN')
            };
            
            transactions.push(transaction);
            updateLocalStorage();
            updateUI();
            
            // Reset form
            transactionForm.reset();
        }

        // Delete transaction
        function deleteTransaction(id) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                transactions = transactions.filter(transaction => transaction.id !== id);
                updateLocalStorage();
                updateUI();
            }
        }

        // Update totals
        function updateTotals() {
            const amounts = transactions.map(transaction => transaction.amount);
            
            const total = amounts.reduce((acc, item) => acc + item, 0);
            const income = amounts.filter(item => item > 0).reduce((acc, item) => acc + item, 0);
            const expense = amounts.filter(item => item < 0).reduce((acc, item) => acc + item, 0) * -1;
            
            balanceTotal.textContent = inrFormatter.format(total);
            incomeTotal.textContent = `+ ${inrFormatter.format(income)}`;
            expenseTotal.textContent = `- ${inrFormatter.format(expense)}`;
        }

        // Update localStorage
        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Render transactions
        function renderTransactions(filter = 'all') {
            transactionList.innerHTML = '';
            
            if (transactions.length === 0) {
                transactionList.innerHTML = '<li class="transaction-item" style="justify-content: center; color: #7f8c8d;">No transactions yet</li>';
                return;
            }
            
            let filteredTransactions = transactions;
            
            if (filter !== 'all') {
                filteredTransactions = transactions.filter(transaction => transaction.type === filter);
            }

            if (filteredTransactions.length === 0) {
                transactionList.innerHTML = '<li class="transaction-item" style="justify-content: center; color: #7f8c8d;">No transactions for this filter</li>';
                return;
            }
            
            filteredTransactions.forEach(transaction => {
                const sign = transaction.amount > 0 ? '+' : '-';
                const amountClass = transaction.amount > 0 ? 'income' : 'expense';
                const formattedAbs = inrFormatter.format(Math.abs(transaction.amount));
                
                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <div class="transaction-details">
                        <div class="transaction-title">${transaction.description}</div>
                        <div class="transaction-category">${transaction.category} • ${transaction.date}</div>
                    </div>
                    <div class="transaction-amount ${amountClass}">${sign} ${formattedAbs}</div>
                    <div class="transaction-actions">
                        <button class="btn btn-delete" onclick="deleteTransaction(${transaction.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                transactionList.appendChild(li);
            });
        }

        // Filter transactions
        function filterTransactions(e) {
            const filter = e.target.dataset.filter;
            
            // Update active button
            filterButtons.forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            renderTransactions(filter);
        }

        // Update charts (Expense Breakdown + Summary)
        function updateCharts() {
            const noDataMessage = document.getElementById('noDataMessage');

            // ---------- Expense Breakdown (Doughnut) ----------
            const expenseTransactions = transactions.filter(t => t.amount < 0);
            const expenseCanvas = document.getElementById('expenseChart');
            if (expenseCanvas) {
                const ctx = expenseCanvas.getContext('2d');

                if (expenseTransactions.length === 0) {
                    if (expenseChart) {
                        expenseChart.destroy();
                        expenseChart = null;
                    }
                    if (noDataMessage) noDataMessage.style.display = 'block';
                } else {
                    if (noDataMessage) noDataMessage.style.display = 'none';

                    const categoryTotals = {};
                    expenseTransactions.forEach(t => {
                        const cat = t.category || 'Other';
                        const absAmt = Math.abs(t.amount);
                        categoryTotals[cat] = (categoryTotals[cat] || 0) + absAmt;
                    });

                    const labels = Object.keys(categoryTotals);
                    const data = Object.values(categoryTotals);

                    if (expenseChart) {
                        expenseChart.destroy();
                    }

                    expenseChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels,
                            datasets: [{
                                data,
                                backgroundColor: [
                                    '#e74c3c',
                                    '#f1c40f',
                                    '#3498db',
                                    '#9b59b6',
                                    '#1abc9c',
                                    '#e67e22',
                                    '#2ecc71',
                                    '#95a5a6',
                                    '#34495e'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            const value = context.parsed;
                                            const dataset = context.chart.data.datasets[context.datasetIndex];
                                            const total = dataset.data.reduce((sum, val) => sum + val, 0);
                                            const percentage = total ? ((value / total) * 100).toFixed(1) : 0;
                                            return `${context.label}: ${inrFormatter.format(value)} (${percentage}%)`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }

            // ---------- Summary Chart (Income, Expense, Balance) ----------
            const summaryCanvas = document.getElementById('summaryChart');
            if (summaryCanvas) {
                const ctx2 = summaryCanvas.getContext('2d');

                const amounts = transactions.map(t => t.amount);
                const total = amounts.reduce((acc, item) => acc + item, 0);
                const income = amounts.filter(item => item > 0).reduce((acc, item) => acc + item, 0);
                const expense = amounts.filter(item => item < 0).reduce((acc, item) => acc + item, 0) * -1;

                if (summaryChart) {
                    summaryChart.destroy();
                }

                summaryChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: ['Income', 'Expense', 'Balance'],
                        datasets: [{
                            data: [income, expense, total],
                            backgroundColor: ['#2ecc71', '#e74c3c', '#3498db'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y || 0;
                                        return inrFormatter.format(value);
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        // Update UI
        function updateUI() {
            updateTotals();
            
            // Render only for the active filter
            let activeFilter = 'all';
            filterButtons.forEach(btn => {
                if (btn.classList.contains('active')) {
                    activeFilter = btn.dataset.filter;
                }
            });
            renderTransactions(activeFilter);

            // Update charts
            updateCharts();
        }

        // Event listeners
        transactionForm.addEventListener('submit', addTransaction);
        filterButtons.forEach(btn => btn.addEventListener('click', filterTransactions));

        // Initial UI update
        updateUI();
    </script>
</body>
</html>
